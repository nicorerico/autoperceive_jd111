[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nicorerico-autoperceive_jd111"
version = "0.1.0"
description = "从输入中抽取数值，计算自动驾驶感知工程师·量化位宽与精度回退相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "nicorerico" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://nicorerico.github.io"
Repository = "https://github.com/nicorerico/autoperceive_jd111"
Issues = "https://github.com/nicorerico/autoperceive_jd111/issues"

[project.scripts]
autoperceive_jd111 = "autoperceive_jd111:main"

[tool.setuptools]
py-modules = ["autoperceive_jd111"]
